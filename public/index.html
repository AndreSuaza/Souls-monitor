<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title>Souls Monitor</title>
    <link rel="icon" href="/assets/souls-in-xtinction-logo-sm.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Cerrar menú"></button>
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <a class="brand" href="#dashboard" aria-label="Souls Monitor inicio"><img src="/assets/souls-in-xtinction-logo-sm.png" alt="" /><span class="brand-label">Souls<span>Monitor</span></span></a>
          <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-label="Contraer menú" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
        </div>
        <nav class="nav" aria-label="Navegación principal">
          <a href="#dashboard" data-view="dashboard" title="Resumen"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span class="nav-label">Resumen</span></a>
          <a href="#services" data-view="services" title="Servicios"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg></span><span class="nav-label">Servicios</span></a>
          <a href="#alerts" data-view="alerts" title="Alertas"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg></span><span class="nav-label">Alertas</span></a>
          <a href="#traffic" data-view="traffic" title="Tráfico"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 20V10m7 10V4m7 16v-7"/></svg></span><span class="nav-label">Tráfico</span></a>
          <a href="#docs" data-view="docs" title="Documentación"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4V4Zm0 0v12a4 4 0 0 0 4 4M9 8h6m-6 4h6"/></svg></span><span class="nav-label">Documentación</span></a>
        </nav>
        <div class="sidebar-foot"><span class="live-dot"></span><span>Actualización automática</span><span id="refresh-label">—</span></div>
      </aside>
      <main class="main-content">
        <header class="topbar"><div class="topbar-title"><button id="mobile-menu-toggle" class="icon-button mobile-menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false"><span aria-hidden="true">☰</span></button><div><p class="eyebrow">OPERACIONES</p><h1 id="page-title">Resumen del sistema</h1><p id="page-subtitle" class="muted">Estado consolidado de servicios, host y tráfico.</p></div></div><div class="topbar-actions"><label class="sr-only" for="range-select">Rango</label><select id="range-select"><option value="15m">15 minutos</option><option value="1h">1 hora</option><option value="6h">6 horas</option><option value="24h" selected>24 horas</option><option value="7d">7 días</option></select><button id="refresh-button" class="button secondary">Actualizar</button></div></header>
        <div id="app" aria-live="polite"><div class="loading-state">Cargando señales operativas…</div></div>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
